[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j2d"
version = "0.1.0"
description = "Processing pipelines for fragmented public-disclosure datasets"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=15",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
j2d = "j2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
